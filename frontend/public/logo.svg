<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>

    <!-- Core Ribbon Gradient 1 -->
    <linearGradient id="ribbon1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Core Ribbon Gradient 2 (Highlight) -->
    <linearGradient id="ribbon2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle ambient inner glow -->
  <circle cx="60" cy="55" r="32" fill="#6366f1" opacity="0.15" filter="blur(16px)" />

  <!-- Logo Mark: Modern Intersecting Progression Glyph (I + Ascending Peak M) -->
  <g filter="url(#subtleGlow)">
    <!-- Left Pillar (The "I" foundation) -->
    <path 
      d="M38 42 C38 38.686 40.686 36 44 36 C47.314 36 50 38.686 50 42 V78 C50 81.314 47.314 84 44 84 C40.686 84 38 81.314 38 78 Z" 
      fill="url(#ribbon2)" 
    />
    
    <!-- Ascending Dynamic Chevron (The "Growth / Talent Ascendance" M-loop) -->
    <path 
      d="M50 56 L64.5 41.5 C66.843 39.157 70.657 39.157 73 41.5 L85.5 54 C87.091 55.591 88 57.749 88 60 V78 C88 81.314 85.314 84 82 84 C78.686 84 76 81.314 76 78 V63.8 L68.8 56.6 L59.6 65.8 C57.257 68.143 53.443 68.143 51.1 65.8 L50 64.7 Z" 
      fill="url(#ribbon1)" 
    />

    <!-- Apex Achievement Node -->
    <circle cx="68.75" cy="40.75" r="4.25" fill="#38bdf8" />
  </g>
</svg>